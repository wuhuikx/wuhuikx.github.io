<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM-Booster Dashboard Login</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #141519;
      --text: #eef0f6;
      --muted: #bfc1d0;
      --border: #303140;
      --brand: #d86ecc;
      --danger: #f25c4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c1d24;
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
      font-size: 14px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: var(--brand);
      font-weight: 600;
    }
    #error {
      margin-top: 10px;
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dashboard Access</h1>
    <p>Enter the shared password to open the LLM-Booster dashboard.</p>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="submit">Sign in</button>
    <div id="error"></div>
  </div>
  <script>
    const CANONICAL_ORIGIN = "https://wuhuikx.github.io";
    const CANONICAL_BASE = "/LLM-Booster/";
    const host = window.location.hostname || "";
    const IS_LOCALHOST =
      host === "localhost" ||
      host === "127.0.0.1" ||
      host === "::1" ||
      host === "[::1]";
    const IS_PRIVATE_IPV4 =
      /^10\./.test(host) ||
      /^192\.168\./.test(host) ||
      /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
    const params = new URLSearchParams(window.location.search);
    const DEV_BYPASS = params.get("dev") === "1" || params.get("dev") === "true";
    const ALLOW_LOCAL_PREVIEW =
      DEV_BYPASS ||
      IS_LOCALHOST ||
      IS_PRIVATE_IPV4 ||
      host.endsWith(".local") ||
      host.endsWith(".internal");
    const BASE_PATH = window.location.pathname.startsWith(CANONICAL_BASE) ? CANONICAL_BASE : "/";
    const HOME_URL = ALLOW_LOCAL_PREVIEW
      ? `${window.location.origin}${BASE_PATH}index.html`
      : `${CANONICAL_ORIGIN}${CANONICAL_BASE}`;

    (function enforceCanonicalOrigin() {
      const currentPath = window.location.pathname;
      if (!ALLOW_LOCAL_PREVIEW && (window.location.origin !== CANONICAL_ORIGIN || !currentPath.startsWith(CANONICAL_BASE))) {
        const normalizedPath = currentPath.startsWith(CANONICAL_BASE)
          ? currentPath
          : `${CANONICAL_BASE}${currentPath.replace(/^\/+/, "")}`;
        window.location.replace(
          `${CANONICAL_ORIGIN}${normalizedPath}${window.location.search}${window.location.hash}`
        );
      }
    })();

    const AUTH_KEY = "llm_booster_dashboard_auth_v1";
    const AUTH_VALUE = "ok";
    const PASSWORD_SHA256 = "0144d0b341cd599517b381b75f162a5e89e84d156e4db6910f3c556da3d1730c";

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(v => v.toString(16).padStart(2, "0")).join("");
    }

    async function login() {
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      const digest = await sha256(password);
      if (digest !== PASSWORD_SHA256) {
        errorEl.textContent = "Incorrect password.";
        return;
      }
      localStorage.setItem(AUTH_KEY, AUTH_VALUE);
      window.location.replace(HOME_URL);
    }

    if (localStorage.getItem(AUTH_KEY) === AUTH_VALUE) {
      window.location.replace(HOME_URL);
    }

    document.getElementById("submit").addEventListener("click", login);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
